name: MYOPS Mobile CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Use the internal Preview Central origin
        run: node -e 'console.log("EXPO_PUBLIC_MYOPS_AUTH_BASE_URL=" + require("./eas.json").build.preview.env.EXPO_PUBLIC_MYOPS_AUTH_BASE_URL)' >> "$GITHUB_ENV"
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Expo configuration validation
        run: npx expo config --type public --json > /dev/null
      - name: Expo export Android bundle
        run: npx expo export --platform android --output-dir dist/android
      - name: Expo export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: myops-mobile-bundles
          path: dist
          retention-days: 7
